name: Portable runtime recovery

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership-and-evidence:
    name: Ownership and evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Validate portable ownership, recovery, and redacted evidence
        run: python -m pytest tests/test_runtime_ownership.py tests/test_portable_runtime_recovery.py tests/test_browser_evidence.py
