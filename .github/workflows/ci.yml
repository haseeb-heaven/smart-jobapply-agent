name: Tests

on:
  push:
    branches: [main, develop, feature]
  pull_request:
    branches: [main, develop, feature]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q job_profession/src job_profession/scripts

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell entry points
        run: shellcheck job_profession/scripts/cron_wrapper.sh
