name: Agent validation gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install agent validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Install shell analysis dependency
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run the authoritative agent validation gate
        run: ./scripts/verify.sh
