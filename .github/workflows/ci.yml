name: Agent validation gate

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install agent validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Install shell analysis dependency
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run the authoritative agent validation gate
        run: ./scripts/verify.sh

  browser-contract:
    name: Playwright browser contract (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # MVP validation runs Chromium only. Firefox/WebKit remain supported
        # by the checked-in Playwright configuration but are deferred until a
        # browser-capable runner and explicit compatibility evidence exist.
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install locked browser test dependencies
        working-directory: tests/browser
        run: npm ci
      - name: Install ${{ matrix.browser }} engine
        working-directory: tests/browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} synthetic browser contract
        working-directory: tests/browser
        run: npx playwright test --config playwright.config.mjs --project=${{ matrix.browser }}
