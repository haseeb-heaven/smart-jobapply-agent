[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-profession"
version = "0.1.0"
description = "Local, evidence-first job discovery and human-review tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Haseeb Mir" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]
browser = ["certifi>=2024.0"]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
where = ["job_profession/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["job_profession/src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["job_profession/private", "job_profession/data", "job_profession/output"]
