<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Smart JobApply Agent multi-agent delivery lifecycle</title>
  <desc id="desc">Six ordered waves from intake through handoff, followed by the monotonic lifecycle states and current repository boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111d"/>
      <stop offset="1" stop-color="#102847"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5eead4"/>
    </marker>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,Liberation Mono,monospace}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:4px;fill:#5eead4}.title{font-size:44px;font-weight:760;fill:#f1f5f9}
      .subtitle{font-size:21px;fill:#a9bad2}.wave{font-size:15px;font-weight:700;letter-spacing:2px;fill:#5eead4}
      .heading{font-size:23px;font-weight:700;fill:#f8fafc}.body{font-size:17px;fill:#b8c6d9}.small{font-size:15px;fill:#9fb0c8}
      .state{font-size:14px;font-weight:700;fill:#dce7f7}.path{font-size:15px;fill:#b8c6d9}.accent{fill:#67e8f9}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="70" y="62" class="sans eyebrow">AGENTS.MD EXECUTION CONTRACT</text>
  <text x="70" y="116" class="sans title">Multi-agent delivery, with independent assurance</text>
  <text x="70" y="151" class="sans subtitle">Distinct identities • ordered ownership transfer • no implicit merge</text>

  <g class="sans">
    <rect x="70" y="190" width="220" height="196" rx="18" fill="#0d1d30" stroke="#315174"/>
    <text x="94" y="224" class="wave">WAVE 0</text>
    <text x="94" y="260" class="heading">Intake</text>
    <text x="94" y="293" class="body"><tspan x="94">Coordinator records</tspan><tspan x="94" dy="27">scope + non-goals</tspan><tspan x="94" dy="27">acceptance + safety</tspan><tspan x="94" dy="27">branch + state + owners</tspan></text>

    <rect x="310" y="190" width="395" height="196" rx="18" fill="#0d1d30" stroke="#315174"/>
    <text x="334" y="224" class="wave">WAVE 1</text>
    <text x="334" y="260" class="heading">Discovery → contract</text>
    <rect x="334" y="281" width="158" height="78" rx="12" fill="#102940" stroke="#3e698e"/>
    <text x="350" y="307" class="body" font-weight="700">Investigator</text>
    <text x="350" y="335" class="small">Current behavior</text>
    <rect x="512" y="281" width="168" height="78" rx="12" fill="#102940" stroke="#3e698e"/>
    <text x="528" y="307" class="body" font-weight="700">Critic</text>
    <text x="528" y="335" class="small">Independent risks</text>
    <text x="334" y="377" class="small">Coordinator resolves findings into one contract.</text>

    <rect x="725" y="190" width="395" height="196" rx="18" fill="#0d1d30" stroke="#315174"/>
    <text x="749" y="224" class="wave">WAVE 2</text>
    <text x="749" y="260" class="heading">Delivery</text>
    <rect x="749" y="281" width="158" height="78" rx="12" fill="#102940" stroke="#3e698e"/>
    <text x="765" y="307" class="body" font-weight="700">Implementer</text>
    <text x="765" y="335" class="small">Production files</text>
    <rect x="927" y="281" width="168" height="78" rx="12" fill="#102940" stroke="#3e698e"/>
    <text x="943" y="307" class="body" font-weight="700">Test author</text>
    <text x="943" y="335" class="small">Disjoint test files</text>
    <text x="749" y="377" class="small">Concurrent only when file ownership is disjoint.</text>

    <rect x="1140" y="190" width="390" height="196" rx="18" fill="#0d1d30" stroke="#315174"/>
    <text x="1164" y="224" class="wave">WAVE 3</text>
    <text x="1164" y="260" class="heading">Break / fix</text>
    <text x="1164" y="295" class="body"><tspan x="1164">Critic challenges integrated change</tspan><tspan x="1164" dy="30">↓ ownership transfers</tspan><tspan x="1164" dy="30">Fixer resolves recorded findings</tspan></text>
    <text x="1164" y="370" class="small">Every disposition needs evidence.</text>

    <rect x="70" y="414" width="760" height="198" rx="18" fill="#0d1d30" stroke="#315174"/>
    <text x="94" y="448" class="wave">WAVE 4</text>
    <text x="94" y="484" class="heading">Assurance</text>
    <rect x="94" y="506" width="330" height="80" rx="12" fill="#102940" stroke="#3e698e"/>
    <text x="112" y="535" class="body" font-weight="700">Reviewer</text>
    <text x="112" y="563" class="small">Actual diff ↔ acceptance evidence</text>
    <rect x="447" y="506" width="358" height="80" rx="12" fill="#102940" stroke="#3e698e"/>
    <text x="465" y="535" class="body" font-weight="700">Test Runner</text>
    <text x="465" y="563" class="mono small">./scripts/verify.sh</text>

    <rect x="850" y="414" width="680" height="198" rx="18" fill="#0d1d30" stroke="#315174"/>
    <text x="874" y="448" class="wave">WAVE 5</text>
    <text x="874" y="484" class="heading">Handoff</text>
    <text x="874" y="520" class="body"><tspan x="874">Coordinator audits findings, validation, privacy,</tspan><tspan x="874" dy="30">remote state, and remaining work.</tspan></text>
    <rect x="874" y="566" width="626" height="30" rx="15" fill="#302316" stroke="#f5b94c"/>
    <text x="1187" y="587" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd594">No merge, commit, or completion is implicit.</text>
  </g>

  <text x="70" y="654" class="sans wave">MONOTONIC TASK STATE</text>
  <g class="sans">
    <g fill="#102940" stroke="#3e698e">
      <rect x="70" y="676" width="142" height="43" rx="21"/><rect x="231" y="676" width="142" height="43" rx="21"/>
      <rect x="392" y="676" width="142" height="43" rx="21"/><rect x="553" y="676" width="142" height="43" rx="21"/>
      <rect x="714" y="676" width="142" height="43" rx="21"/><rect x="875" y="676" width="142" height="43" rx="21"/>
      <rect x="1036" y="676" width="142" height="43" rx="21"/><rect x="1197" y="676" width="142" height="43" rx="21"/>
      <rect x="1358" y="676" width="172" height="43" rx="21" fill="#12352f" stroke="#5eead4"/>
    </g>
    <g class="state" text-anchor="middle">
      <text x="141" y="703">intake</text><text x="302" y="703">investigated</text><text x="463" y="703">contracted</text>
      <text x="624" y="703">implemented</text><text x="785" y="703">challenged</text><text x="946" y="703">fixed</text>
      <text x="1107" y="703">reviewed</text><text x="1268" y="703">verified</text><text x="1444" y="703">complete</text>
    </g>
    <g stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)">
      <line x1="212" y1="698" x2="226" y2="698"/><line x1="373" y1="698" x2="387" y2="698"/><line x1="534" y1="698" x2="548" y2="698"/>
      <line x1="695" y1="698" x2="709" y2="698"/><line x1="856" y1="698" x2="870" y2="698"/><line x1="1017" y1="698" x2="1031" y2="698"/>
      <line x1="1178" y1="698" x2="1192" y2="698"/><line x1="1339" y1="698" x2="1353" y2="698"/>
    </g>
  </g>

  <rect x="70" y="756" width="1460" height="100" rx="16" fill="#091724" stroke="#284663"/>
  <text x="94" y="788" class="sans wave">CURRENT REPOSITORY BOUNDARIES</text>
  <text x="94" y="821" class="mono path">core: jobapply_agent/src  •  scripts: jobapply_agent/scripts  •  policy: jobapply_agent/config</text>
  <text x="94" y="846" class="mono path">browser boundary: skills/easy-apply-tab-monitor  •  Smart Queue: 1–10 managed tabs (default 5)</text>
</svg>
