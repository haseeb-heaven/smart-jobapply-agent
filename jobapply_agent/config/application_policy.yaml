schema_version: 2
application_policy:
  purpose: "Local, evidence-first recommendation preparation under candidate control."
  candidate_owns_all_application_actions: true
  application_actions_performed_by_agents: 0

  core_engine_boundary:
    paths:
      - jobapply_agent/src
      - jobapply_agent/scripts
    network_access: prohibited
    browser_access: prohibited
    allowed_automation:
      - validate_candidate_intake_without_reading_documents
      - activate_only_explicitly_user_confirmed_intake
      - validate_closed_llm_listing_extraction
      - evaluate_hard_eligibility_before_ranking
      - score_only_eligible_jobs
      - compose_evidence_grounded_explanations
      - prepare_local_field_suggestions_for_candidate_review
      - record_missing_answer_prompts
      - bind_outcome_empty_candidate_memory_to_authenticated_durable_queue_id_on_first_nonempty_batch
      - validate_candidate_revision_pairs_against_authenticated_queue_before_suppression
      - preserve_exact_url_suppression_across_same_queue_profile_or_policy_revisions
      - reject_different_queue_memory_pairing_without_mutation
      - reject_populated_unscoped_legacy_memory_before_migration_mutation
      - plan_candidate_selected_one_to_ten_listing_smart_queue_replenishment
      - mark_missing_or_closed_tabs_as_released_without_inferring_an_outcome
      - recover_stale_waiting_from_reliable_initial_snapshot_as_open_or_open_failed
      - preserve_current_cycle_waiting_when_follow_up_snapshot_fails
      - refill_released_slots_only_from_distinct_already_admitted_candidates
      - report_search_needed_when_no_admitted_candidate_can_refill_a_released_slot
      - track_candidate_recorded_review_state

  persistent_host_health:
    running: live_child_and_bridge_streams
    ready: complete_valid_redacted_status_received_on_live_status_stream
    healthy: running_and_ready
    cannot_mark_ready_or_healthy:
      - partial_or_invalid_status
      - initialization_failure
      - status_stream_end_or_error
      - terminal_frame_or_process_state

  bounded_tab_watcher:
    authority: skills/easy-apply-tab-monitor/SKILL.md
    runtime_boundary:
      llm: bring_your_own
      operating_system: any
      browser: any_with_a_conforming_tab_bridge
      compatibility_adapter: macos_chrome_applescript
      external_bridge_protocol: argv_json
    allowed_automation:
      - list_current_tab_urls
      - open_an_exact_approved_linkedin_or_indeed_listing_url_when_missing
    prohibited_automation:
      - inspect_page_content
      - inspect_browser_credentials_or_cookies
      - enter_an_application_flow
      - close_or_replace_a_target_with_a_new_search_result
      - infer_an_application_outcome_or_candidate_memory_entry_from_a_tab_close
      - click_any_page_control
      - type_any_field_value
      - upload_any_document

  repository_wide_prohibited_automation:
    - log_in_or_handle_authentication
    - type_personal_data_or_application_field_values
    - click_apply_easy_apply_continue_next_review_or_submit
    - upload_a_resume_or_attachment
    - send_a_message
    - accept_attestations
    - infer_or_answer_unspecified_screening_questions
    - solve_or_bypass_captcha
    - answer_eeo_or_sensitive_demographic_questions

  candidate_review_required_for:
    - company_name
    - job_title
    - every_claim
    - current_location
    - work_authorization
    - sponsorship
    - salary_or_compensation
    - notice_period_or_availability
    - all_application_fields
    - all_screening_and_eeo_questions
